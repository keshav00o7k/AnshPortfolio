<svg xmlns="http://www.w3.org/2000/svg" width="60" height="75" viewBox="0 0 60 75">
  <defs>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E8EC" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#B8B8C2" />
      <stop offset="75%" stop-color="#D8D8E0" />
      <stop offset="100%" stop-color="#8E8E98" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
    </linearGradient>
    <filter id="metalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Top Ribbon Attachment Buckle -->
  <rect x="14" y="2" width="32" height="10" rx="3" fill="url(#metalGrad)" stroke="#7A7A84" stroke-width="1" />
  <rect x="18" y="4" width="24" height="4" rx="1.5" fill="#201C24" />

  <!-- Swivel Connector Rivet -->
  <circle cx="30" cy="18" r="6" fill="url(#metalGrad)" stroke="#6A6A74" stroke-width="1" />
  <circle cx="30" cy="18" r="3" fill="#4A4A54" />

  <!-- Lobster Hook / Metal Clasp Body -->
  <g filter="url(#metalShadow)">
    <!-- Main hook loop -->
    <path d="M 22 24 C 22 20, 38 20, 38 24 L 40 44 C 42 54, 38 68, 30 70 C 22 68, 18 54, 20 44 Z" 
          fill="url(#metalGrad)" stroke="#6E6E78" stroke-width="1.2" />

    <!-- Clasp Trigger / Gate mechanism (Symmetrical for clean split) -->
    <rect x="25" y="32" width="10" height="22" rx="2" fill="url(#metalGrad)" stroke="#80808C" stroke-width="0.8" />
    <line x1="30" y1="32" x2="30" y2="54" stroke="#60606A" stroke-width="1" />

    <!-- Hook Opening Cutout -->
    <path d="M 26 50 C 26 58, 34 58, 34 50 Z" fill="#201C24" opacity="0.6" />
    <circle cx="30" cy="62" r="3.5" fill="#201C24" opacity="0.8" />
  </g>
</svg>

